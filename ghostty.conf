# Mumyeong Theme for Ghostty — colors only.
# Background is lifted to oma1 (Onyx) so the terminal floats slightly above the wallpaper.
# oma2 is reserved for selection_background across the palette, so we avoid it here to
# keep gum/helix/etc. selection highlights distinguishable inside ghostty.
# selection-background uses oma3 (Zinc) to stay visible against the lifted base.
background = #18181B
foreground = #E4E4E7
cursor-color = #F4F4F5
selection-background = #71717A
selection-foreground = #FFFFFF

palette = 0=#09090B
palette = 1=#E08A8A
palette = 2=#81C784
palette = 3=#D4C88C
palette = 4=#CBD5E1
palette = 5=#F4F4F5
palette = 6=#94A3B8
palette = 7=#A1A1AA
palette = 8=#71717A
palette = 9=#E08A8A
palette = 10=#81C784
palette = 11=#D4C88C
palette = 12=#94A3B8
palette = 13=#C4A6CF
palette = 14=#94A3B8
palette = 15=#FFFFFF
