include=~/.local/share/omarchy/default/mako/core.ini

# Mumyeong Theme for Mako - colors only.
# Glass-edge border (oma3) instead of full accent for softer presence on busy wallpapers.
# Do not include ~/.local/state/omarchy/toggles/mako.ini — omarchy master never creates it,
# and mako treats a missing include as a fatal parse error.
text-color=#E4E4E7
border-color=#71717A
background-color=#09090B
progress-color=over #F4F4F540

[urgency=high]
border-color=#E08A8A
