# Mumyeong Theme for Hyprland.
# Shipping this file disables omarchy's default/themed/hyprland.conf.tpl render,
# so $activeBorderColor must be kept in sync with colors.toml::accent manually.
# The mumyeong-specific addition is $inactiveBorderColor (oma3) — a "glass edge"
# tone-down that the built-in template does not express.
$activeBorderColor = rgb(F4F4F5)
$inactiveBorderColor = rgb(71717A)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}
