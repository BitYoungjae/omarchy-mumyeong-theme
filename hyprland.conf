# Mumyeong Theme for Hyprland (v3.8 .conf format)
# Mirrors hyprland.lua. Remove this file once Omarchy ships the .lua loader.
$activeBorderColor = rgb(F4F4F5)
$inactiveBorderColor = rgb(71717A)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}
